<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- F-16 Style Technical Blueprint Wireframe -->
  <g opacity="0.8">
    <!-- Main Body -->
    <path d="M150 300 L250 280 L550 280 L650 300 L550 320 L250 320 Z" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M250 280 L350 150 L450 150 L550 280" stroke="currentColor" stroke-width="2"/>
    <path d="M250 320 L350 450 L450 450 L550 320" stroke="currentColor" stroke-width="2"/>
    
    <!-- Wings -->
    <path d="M350 280 L200 100 L400 100 L500 280" stroke="currentColor" stroke-width="1.5"/>
    <path d="M350 320 L200 500 L400 500 L500 320" stroke="currentColor" stroke-width="1.5"/>
    
    <!-- Tail -->
    <path d="M600 290 L700 230 L720 230 L650 300" stroke="currentColor" stroke-width="2"/>
    <path d="M600 310 L700 370 L720 370 L650 300" stroke="currentColor" stroke-width="2"/>
    
    <!-- Cockpit Area -->
    <ellipse cx="280" cy="300" rx="40" ry="15" stroke="currentColor" stroke-width="1"/>
    
    <!-- Technical Grid/Lines -->
    <line x1="100" y1="300" x2="750" y2="300" stroke="currentColor" stroke-width="0.5" stroke-dasharray="10 5" opacity="0.3"/>
    <line x1="400" y1="50" x2="400" y2="550" stroke="currentColor" stroke-width="0.5" stroke-dasharray="10 5" opacity="0.3"/>
    
    <!-- Measurement indicators -->
    <path d="M150 250 L150 240 M650 250 L650 240" stroke="currentColor" stroke-width="1"/>
    <line x1="150" y1="245" x2="650" y2="245" stroke="currentColor" stroke-width="0.5"/>
    <text x="380" y="240" fill="currentColor" font-size="10" font-family="monospace">8.42m</text>
  </g>
</svg>
